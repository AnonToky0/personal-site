server {
    listen 80;
    listen [::]:80;
    server_name itworksforme.cn www.itworksforme.cn 112.124.35.111;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://itworksforme.cn$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.itworksforme.cn;
    ssl_certificate /etc/letsencrypt/live/itworksforme.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itworksforme.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://itworksforme.cn$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name itworksforme.cn;
    ssl_certificate /etc/letsencrypt/live/itworksforme.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itworksforme.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SiteTLS:10m;
    ssl_session_timeout 1d;
    root /var/www/personal-site;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}
