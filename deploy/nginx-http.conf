server {
    listen 80;
    listen [::]:80;
    server_name itworksforme.cn www.itworksforme.cn 112.124.35.111;
    root /var/www/personal-site;
    index index.html;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
}
